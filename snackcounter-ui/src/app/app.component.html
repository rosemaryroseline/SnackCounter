
<div class="app-container">

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="brand">
      <div class="brand-icon">S</div>
      <div>
        <h2>SnackCounter</h2>
        <span>Office Snack Management</span>
      </div>
    </div>

    <div class="menu-label">MAIN MENU</div>

    <nav class="navigation">

      <a routerLink="/dashboard"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         class="nav-item">
        <span class="nav-icon">▦</span>
        Dashboard
      </a>

      <a routerLink="/refills"
         routerLinkActive="active"
         class="nav-item">
        <span class="nav-icon">☷</span>
        Refill Requests
      </a>

      <a routerLink="/assignments"
         routerLinkActive="active"
         class="nav-item">
        <span class="nav-icon">♧</span>
        My Assignments
      </a>

      <a routerLink="/purchases"
         routerLinkActive="active"
         class="nav-item">
        <span class="nav-icon">▤</span>
        Purchases
      </a>

      <a routerLink="/reports"
         routerLinkActive="active"
         class="nav-item">
        <span class="nav-icon">▥</span>
        Monthly Reports
      </a>

    </nav>

    <div class="sidebar-bottom">
      <div class="profile">
        <div class="profile-avatar">R</div>
        <div class="profile-details">
          <strong>Rose</strong>
          <span>Office Employee</span>
        </div>
      </div>
    </div>

  </aside>

  <!-- Main Content -->
  <main class="main-content">

    <header class="topbar">
      <div>
        <h2>SnackCounter</h2>
        <p>Manage office snacks and refill requests</p>
      </div>

      <div class="topbar-right">
        <div class="office-selector">
          <span class="office-dot"></span>
          Bengaluru Office
        </div>
      </div>
    </header>

    <!-- Routed pages will display here -->
    <router-outlet></router-outlet>

  </main>

</div>
